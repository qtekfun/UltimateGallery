name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Release notes for the current version (CHANGELOG.md and F-Droid changelogs)
        run: scripts/release-notes.sh

      - name: Lint, static analysis, unit tests and debug build
        run: ./gradlew check assembleDebug

      - name: Verify the app stays offline (no network permission)
        run: |
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          perms=$("$aapt2" dump permissions app/build/outputs/apk/debug/app-debug.apk)
          echo "$perms"
          if echo "$perms" | grep -q 'android.permission.INTERNET'; then echo "INTERNET permission found"; exit 1; fi

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            build/reports/
          retention-days: 14
